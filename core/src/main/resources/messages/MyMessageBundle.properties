settings.devenv.feature.lsp.name=Back Nix files with the server started by 'devenv lsp'
settings.devenv.feature.lsp.description=Completion, documentation and diagnostics for devenv options, in devenv.nix and the files it imports.
settings.devenv.feature.jdk.name=Project SDK from languages.java
settings.devenv.feature.jdk.description=Sets the Project SDK to the JDK devenv declares, and puts it back whenever an import or a choice made by hand moves it.<br/>Once off, set it yourself under Project Structure > Project > SDK.
settings.devenv.feature.gradle.name=Gradle distribution from languages.java.gradle
settings.devenv.feature.gradle.description=Points the linked Gradle builds at the Gradle devenv declares, run on the Project SDK, instead of the wrapper downloading one of their own.<br/>Once off, set them yourself under Build, Execution, Deployment > Build Tools > Gradle > Distribution and Gradle JVM.
settings.devenv.feature.maven.name=Maven home from languages.java.maven
settings.devenv.feature.maven.description=Sets the Maven home path to the Maven devenv declares, instead of the one bundled with the IDE.<br/>Once off, set it yourself under Build, Execution, Deployment > Build Tools > Maven > Maven home path.
settings.devenv.feature.processes.name=Show the declared processes in the Services tool window
settings.devenv.feature.processes.description=Their status and their logs, with start, stop and restart, and 'devenv up' and 'devenv down' on the root node.
settings.devenv.feature.treefmt.name=Reformat Code with the project's treefmt
settings.devenv.feature.treefmt.description=Formats the files treefmt is configured for exactly as a commit would, leaving the others to the IDE's own formatter.<br/>Once off, every file is formatted the way Editor > Code Style says.
settings.devenv.feature.exclude.name=Exclude the .devenv directory
settings.devenv.feature.exclude.description=Keeps devenv's state directory, and the Nix store paths it links to, out of indexing and search.<br/>Once off, the directory is yours to exclude with Mark Directory as > Excluded in the project tree.
